[package]
name = "switchboard"
version = "0.1.0"
edition = "2021"
description = "Drag and drop chats between Claude Desktop accounts"
license = "MIT"
repository = "https://github.com/Udhay-Adithya/switchboard"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 2
