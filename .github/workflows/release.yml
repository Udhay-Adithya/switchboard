name: release

# The macOS build is signed and notarized locally with scripts/release.sh,
# which pushes the tag that triggers this workflow and uploads its own DMG
# to the release. This workflow covers the platforms that don't need Apple
# signing.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release
      - run: |
          mkdir switchboard-linux
          cp target/release/switchboard switchboard-linux/
          tar -czf switchboard-linux.tar.gz switchboard-linux
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-linux
          path: switchboard-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/switchboard.exe -DestinationPath switchboard-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-windows
          path: switchboard-windows.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
